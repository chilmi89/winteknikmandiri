basePath: /
definitions:
  dto.CreateFAQRequest:
    properties:
      answer:
        minLength: 5
        type: string
      category:
        maxLength: 100
        type: string
      is_active:
        type: boolean
      question:
        minLength: 5
        type: string
      sort_order:
        type: integer
    required:
    - answer
    - question
    type: object
  dto.CreateInquiryRequest:
    properties:
      address:
        maxLength: 255
        type: string
      name:
        maxLength: 150
        minLength: 2
        type: string
      notes:
        type: string
      phone:
        maxLength: 50
        minLength: 6
        type: string
      service:
        maxLength: 100
        type: string
    required:
    - name
    - notes
    - phone
    - service
    type: object
  dto.CreateInquiryResponse:
    properties:
      data:
        $ref: '#/definitions/dto.InquiryResponse'
      message:
        example: Permohonan konsultasi berhasil disimpan
        type: string
    type: object
  dto.CreateJamOperasionalRequest:
    properties:
      day_label:
        example: Senin – Jumat
        maxLength: 100
        minLength: 2
        type: string
      hours:
        example: 08.00 – 16.00
        maxLength: 100
        minLength: 2
        type: string
      is_active:
        type: boolean
      is_closed:
        type: boolean
      sort_order:
        type: integer
    required:
    - day_label
    - hours
    type: object
  dto.CreatePilarLayananRequest:
    properties:
      code:
        example: "01"
        maxLength: 10
        type: string
      cta_text:
        example: Konsultasi
        type: string
      description:
        example: Keterangan singkat...
        type: string
      is_active:
        type: boolean
      is_featured:
        type: boolean
      link_url:
        example: /layanan
        type: string
      sort_order:
        type: integer
      title:
        example: Supply & pengadaan AC
        maxLength: 200
        minLength: 2
        type: string
    required:
    - title
    type: object
  dto.FAQEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.FAQResponse'
      message:
        example: FAQ berhasil dibuat
        type: string
    type: object
  dto.FAQMessageResponse:
    properties:
      message:
        example: FAQ berhasil dihapus
        type: string
    type: object
  dto.FAQResponse:
    properties:
      answer:
        type: string
      category:
        type: string
      created_at:
        type: string
      id:
        example: 0f8fad5b-d9cb-469f-a165-70867728950e
        type: string
      is_active:
        type: boolean
      question:
        type: string
      sort_order:
        type: integer
      updated_at:
        type: string
    type: object
  dto.InquiryResponse:
    properties:
      address:
        type: string
      created_at:
        type: string
      id:
        example: 0f8fad5b-d9cb-469f-a165-70867728950e
        type: string
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      service:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.JamOperasionalBundleEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.JamOperasionalBundleResponse'
      message:
        type: string
    type: object
  dto.JamOperasionalBundleResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.JamOperasionalItemResponse'
        type: array
      setting:
        $ref: '#/definitions/dto.JamOperasionalSettingResponse'
    type: object
  dto.JamOperasionalItemEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.JamOperasionalItemResponse'
      message:
        type: string
    type: object
  dto.JamOperasionalItemResponse:
    properties:
      created_at:
        type: string
      day_label:
        example: Senin – Jumat
        type: string
      hours:
        example: 08.00 – 16.00
        type: string
      id:
        example: 0f8fad5b-d9cb-469f-a165-70867728950e
        type: string
      is_active:
        example: true
        type: boolean
      is_closed:
        example: false
        type: boolean
      sort_order:
        example: 1
        type: integer
      updated_at:
        type: string
    type: object
  dto.JamOperasionalMessageResponse:
    properties:
      message:
        type: string
    type: object
  dto.JamOperasionalSettingEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.JamOperasionalSettingResponse'
      message:
        type: string
    type: object
  dto.JamOperasionalSettingResponse:
    properties:
      badge_text:
        example: Buka Hari Kerja
        type: string
      note:
        example: '* Untuk mitra kontrak...'
        type: string
      title:
        example: Jam Operasional
        type: string
      updated_at:
        type: string
    type: object
  dto.ListFAQResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.FAQResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  dto.ListInquiryResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.InquiryResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  dto.ListPilarLayananEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.PilarLayananResponse'
        type: array
      message:
        type: string
    type: object
  dto.PilarLayananEnvelope:
    properties:
      data:
        $ref: '#/definitions/dto.PilarLayananResponse'
      message:
        type: string
    type: object
  dto.PilarLayananMessageResponse:
    properties:
      message:
        type: string
    type: object
  dto.PilarLayananResponse:
    properties:
      code:
        example: "01"
        type: string
      created_at:
        type: string
      cta_text:
        example: Konsultasi
        type: string
      description:
        example: Split, cassette, floor standing, hingga VRF/VRV dari berbagai merk.
        type: string
      id:
        example: 0f8fad5b-d9cb-469f-a165-70867728950e
        type: string
      is_active:
        example: true
        type: boolean
      is_featured:
        example: false
        type: boolean
      link_url:
        example: /layanan
        type: string
      sort_order:
        example: 1
        type: integer
      title:
        example: Supply & pengadaan AC
        type: string
      updated_at:
        type: string
    type: object
  dto.UpdateFAQRequest:
    properties:
      answer:
        minLength: 5
        type: string
      category:
        maxLength: 100
        type: string
      is_active:
        type: boolean
      question:
        minLength: 5
        type: string
      sort_order:
        type: integer
    required:
    - answer
    - question
    type: object
  dto.UpdateJamOperasionalRequest:
    properties:
      day_label:
        maxLength: 100
        minLength: 2
        type: string
      hours:
        maxLength: 100
        minLength: 2
        type: string
      is_active:
        type: boolean
      is_closed:
        type: boolean
      sort_order:
        type: integer
    type: object
  dto.UpdateJamOperasionalSettingRequest:
    properties:
      badge_text:
        maxLength: 100
        type: string
      note:
        type: string
      title:
        maxLength: 100
        type: string
    type: object
  dto.UpdatePilarLayananRequest:
    properties:
      code:
        maxLength: 10
        type: string
      cta_text:
        type: string
      description:
        type: string
      is_active:
        type: boolean
      is_featured:
        type: boolean
      link_url:
        type: string
      sort_order:
        type: integer
      title:
        maxLength: 200
        minLength: 2
        type: string
    type: object
  httpx.ErrorResponse:
    properties:
      details: {}
      error:
        example: Validasi gagal
        type: string
    type: object
  httpx.HealthResponse:
    properties:
      database:
        example: connected
        type: string
      service:
        example: CV Win Teknik Mandiri API
        type: string
      status:
        example: healthy
        type: string
      timestamp:
        example: "2026-11-01T08:00:00+07:00"
        type: string
    type: object
info:
  contact: {}
  description: |-
    REST API layanan AC, ducting, dan cold storage CV Win Teknik Mandiri.
    Seluruh endpoint mengembalikan JSON. Data disimpan di PostgreSQL dengan query native (database/sql + pgx), tanpa ORM.
  title: CV Win Teknik Mandiri API
  version: "1.0"
paths:
  /api/v1/faqs:
    get:
      description: Endpoint publik. Secara default hanya mengembalikan FAQ aktif,
        urut sort_order.
      parameters:
      - description: Filter kategori
        in: query
        name: category
        type: string
      - description: Cari pada pertanyaan atau jawaban
        in: query
        name: search
        type: string
      - description: Ikutkan FAQ non-aktif (untuk dashboard)
        in: query
        name: include_inactive
        type: boolean
      - default: 20
        description: Jumlah data per halaman (default 20, maks 100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset pagination
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListFAQResponse'
        "400":
          description: Parameter query tidak valid
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Database tidak terhubung
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Daftar FAQ
      tags:
      - faqs
    post:
      consumes:
      - application/json
      description: Menambahkan FAQ. is_active default true bila tidak dikirim.
      parameters:
      - description: Data FAQ
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateFAQRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.FAQEnvelope'
        "400":
          description: Input tidak valid
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Database tidak terhubung
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Buat FAQ baru
      tags:
      - faqs
  /api/v1/faqs/{id}:
    delete:
      description: 'Soft delete: data tidak dihapus permanen, hanya diisi deleted_at.'
      parameters:
      - description: ID FAQ (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FAQMessageResponse'
        "400":
          description: ID tidak valid
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: FAQ tidak ditemukan
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Database tidak terhubung
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Hapus FAQ
      tags:
      - faqs
    get:
      description: Mengambil satu FAQ berdasarkan ID.
      parameters:
      - description: ID FAQ (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FAQEnvelope'
        "400":
          description: ID tidak valid
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: FAQ tidak ditemukan
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Database tidak terhubung
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Detail FAQ
      tags:
      - faqs
    put:
      consumes:
      - application/json
      description: Field opsional (category, sort_order, is_active) dipertahankan
        bila tidak dikirim.
      parameters:
      - description: ID FAQ (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Data FAQ
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateFAQRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FAQEnvelope'
        "400":
          description: Input tidak valid
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: FAQ tidak ditemukan
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Database tidak terhubung
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Perbarui FAQ
      tags:
      - faqs
  /api/v1/inquiries:
    get:
      description: Menampilkan permohonan terbaru beserta total data (untuk dashboard).
      parameters:
      - default: 20
        description: Jumlah data per halaman (default 20, maks 100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset pagination
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListInquiryResponse'
        "400":
          description: Parameter query tidak valid
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Database tidak terhubung
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Daftar permohonan konsultasi
      tags:
      - inquiries
    post:
      consumes:
      - application/json
      description: Menyimpan permohonan dari formulir kontak website. Status awal
        selalu "pending".
      parameters:
      - description: Data permohonan
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateInquiryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateInquiryResponse'
        "400":
          description: Input tidak valid
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Database tidak terhubung
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Kirim permohonan konsultasi
      tags:
      - inquiries
  /api/v1/jam-operasional:
    get:
      description: Mengembalikan setting kartu jadwal dan seluruh baris hari kerja.
      parameters:
      - description: Sertakan baris non-aktif (khusus dashboard)
        in: query
        name: include_inactive
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.JamOperasionalBundleEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Ambil bundle jadwal & setting jam operasional
      tags:
      - jam_operasional
    post:
      consumes:
      - application/json
      description: Menambahkan baris jadwal kerja baru.
      parameters:
      - description: Payload baris jadwal
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateJamOperasionalRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.JamOperasionalItemEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Tambah baris jadwal jam operasional
      tags:
      - jam_operasional
  /api/v1/jam-operasional/{id}:
    delete:
      description: Menghapus satu baris jadwal kerja berdasarkan ID UUID.
      parameters:
      - description: ID Baris Jadwal (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.JamOperasionalMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Hapus baris jadwal (soft delete)
      tags:
      - jam_operasional
    get:
      description: Mengambil satu baris jadwal berdasarkan ID UUID.
      parameters:
      - description: ID Baris Jadwal (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.JamOperasionalItemEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Ambil satu baris jadwal
      tags:
      - jam_operasional
    put:
      consumes:
      - application/json
      description: Memperbarui baris jadwal kerja berdasarkan ID UUID.
      parameters:
      - description: ID Baris Jadwal (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Payload update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateJamOperasionalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.JamOperasionalItemEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Perbarui baris jadwal jam operasional
      tags:
      - jam_operasional
  /api/v1/jam-operasional/setting:
    put:
      consumes:
      - application/json
      description: Mengubah badge teks atas, judul, dan catatan kaki berbintang.
      parameters:
      - description: Payload setting
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateJamOperasionalSettingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.JamOperasionalSettingEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Perbarui pengaturan kartu jam operasional
      tags:
      - jam_operasional
  /api/v1/pilar-layanan:
    get:
      description: Mengambil daftar pilar layanan aktif untuk homepage.
      parameters:
      - description: Sertakan yang nonaktif (khusus admin)
        in: query
        name: include_inactive
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListPilarLayananEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Daftar pilar layanan
      tags:
      - pilar_layanan
    post:
      consumes:
      - application/json
      description: Menambahkan data kartu pilar layanan baru.
      parameters:
      - description: Payload pilar layanan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePilarLayananRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.PilarLayananEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Tambah pilar layanan baru
      tags:
      - pilar_layanan
  /api/v1/pilar-layanan/{id}:
    delete:
      description: Menghapus pilar layanan berdasarkan ID UUID.
      parameters:
      - description: ID Pilar Layanan (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PilarLayananMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Hapus pilar layanan (soft delete)
      tags:
      - pilar_layanan
    get:
      description: Mengambil detail pilar layanan berdasarkan ID UUID.
      parameters:
      - description: ID Pilar Layanan (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PilarLayananEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Detail satu pilar layanan
      tags:
      - pilar_layanan
    put:
      consumes:
      - application/json
      description: Memperbarui pilar layanan berdasarkan ID UUID.
      parameters:
      - description: ID Pilar Layanan (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Payload update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePilarLayananRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PilarLayananEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Perbarui data pilar layanan
      tags:
      - pilar_layanan
  /health:
    get:
      description: Menunjukkan status server dan koneksi database PostgreSQL.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpx.HealthResponse'
      summary: Health check
      tags:
      - system
securityDefinitions:
  AdminToken:
    in: header
    name: X-Admin-Token
    type: apiKey
swagger: "2.0"
