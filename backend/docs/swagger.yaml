info:
  contact: {}
  description: |-
    REST API layanan AC, ducting, dan cold storage CV Win Teknik Mandiri.
    Seluruh endpoint mengembalikan JSON. Data disimpan di PostgreSQL dengan query native (database/sql + pgx), tanpa ORM.
  title: CV Win Teknik Mandiri API
  version: "1.0"
paths:
  /api/v1/faqs:
    get:
      description: Endpoint publik. Secara default hanya mengembalikan FAQ aktif,
        urut sort_order.
      parameters:
      - description: Filter kategori
        in: query
        name: category
        type: string
      - description: Cari pada pertanyaan atau jawaban
        in: query
        name: search
        type: string
      - description: Ikutkan FAQ non-aktif (untuk dashboard)
        in: query
        name: include_inactive
        type: boolean
      - default: 20
        description: Jumlah data per halaman (default 20, maks 100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset pagination
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListFAQResponse'
        "400":
          description: Parameter query tidak valid
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Database tidak terhubung
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Daftar FAQ
      tags:
      - faqs
    post:
      consumes:
      - application/json
      description: Menambahkan FAQ. is_active default true bila tidak dikirim.
      parameters:
      - description: Data FAQ
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateFAQRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.FAQEnvelope'
        "400":
          description: Input tidak valid
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Database tidak terhubung
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Buat FAQ baru
      tags:
      - faqs
  /api/v1/faqs/{id}:
    delete:
      description: 'Soft delete: data tidak dihapus permanen, hanya diisi deleted_at.'
      parameters:
      - description: ID FAQ (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FAQMessageResponse'
        "400":
          description: ID tidak valid
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: FAQ tidak ditemukan
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Database tidak terhubung
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Hapus FAQ
      tags:
      - faqs
    get:
      description: Mengambil satu FAQ berdasarkan ID.
      parameters:
      - description: ID FAQ (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FAQEnvelope'
        "400":
          description: ID tidak valid
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: FAQ tidak ditemukan
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Database tidak terhubung
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Detail FAQ
      tags:
      - faqs
    put:
      consumes:
      - application/json
      description: Field opsional (category, sort_order, is_active) dipertahankan
        bila tidak dikirim.
      parameters:
      - description: ID FAQ (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Data FAQ
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateFAQRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.FAQEnvelope'
        "400":
          description: Input tidak valid
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: FAQ tidak ditemukan
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Database tidak terhubung
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Perbarui FAQ
      tags:
      - faqs
  /api/v1/gaji:
    get:
      parameters:
      - description: Filter per Tim (UUID)
        in: query
        name: team_id
        type: string
      - description: Filter per Proyek / Order (UUID)
        in: query
        name: order_id
        type: string
      - description: Filter per tanggal YYYY-MM-DD
        in: query
        name: date
        type: string
      - description: Filter status (draft, dibayar)
        in: query
        name: status
        type: string
      - description: Cari kode gaji / nama tim
        in: query
        name: search
        type: string
      - default: 1
        description: Nomor halaman
        in: query
        name: page
        type: integer
      - default: 10
        description: Jumlah data per halaman
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListGajiEnvelope'
      summary: Daftar slip gaji tim dengan filter & pagination
      tags:
      - gaji
    post:
      consumes:
      - application/json
      parameters:
      - description: Payload slip gaji
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateGajiRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.GajiEnvelope'
      summary: Buat slip gaji baru untuk tim tertentu
      tags:
      - gaji
  /api/v1/gaji/{id}:
    delete:
      parameters:
      - description: ID Slip Gaji (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GajiMessageResponse'
      summary: Hapus slip gaji (soft delete)
      tags:
      - gaji
    get:
      parameters:
      - description: ID Slip Gaji (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GajiEnvelope'
      summary: Detail slip gaji tim beserta seluruh proyek yang ditempelkan
      tags:
      - gaji
    put:
      consumes:
      - application/json
      parameters:
      - description: ID Slip Gaji (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Payload edit
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateGajiRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GajiEnvelope'
      summary: Perbarui slip gaji (status, catatan, tim)
      tags:
      - gaji
  /api/v1/gaji/{id}/proyek:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID Slip Gaji (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Data proyek & upah borongan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AttachProyekRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.GajiEnvelope'
      summary: Tempelkan proyek ke slip gaji
      tags:
      - gaji
  /api/v1/gaji/available-orders:
    get:
      parameters:
      - description: ID Slip Gaji yang sedang diedit (UUID)
        in: query
        name: exclude_gaji_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListAvailableOrdersEnvelope'
      summary: Daftar proyek closing yang belum pernah digajikan di slip lain
      tags:
      - gaji
  /api/v1/gaji/proyek/{proyek_id}:
    delete:
      parameters:
      - description: ID Gaji Proyek (UUID)
        in: path
        name: proyek_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GajiEnvelope'
      summary: Lepas proyek dari slip gaji
      tags:
      - gaji
    put:
      consumes:
      - application/json
      parameters:
      - description: ID Gaji Proyek (UUID)
        in: path
        name: proyek_id
        required: true
        type: string
      - description: Nominal upah baru (mis. Rp 1.500.000)
        in: query
        name: nominal
        required: true
        type: string
      - description: Catatan khusus
        in: query
        name: keterangan
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GajiEnvelope'
      summary: Edit nominal upah borongan proyek
      tags:
      - gaji
  /api/v1/gallery:
    get:
      description: Mengembalikan seluruh daftar proyek, total counter, dan tab kategori
        unik yang dihitung otomatis.
      parameters:
      - description: Filter kategori tertentu (mis. Mall & Retail)
        in: query
        name: category
        type: string
      - description: Sertakan yang non-aktif (khusus dashboard)
        in: query
        name: include_inactive
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GalleryBundleEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Ambil bundle proyek galeri & filter kategori dinamis
      tags:
      - gallery
    post:
      consumes:
      - application/json
      description: Menambahkan data dokumentasi proyek baru (kategori bebas diinput).
      parameters:
      - description: Payload proyek galeri
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateGalleryProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.GalleryProjectEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Tambah proyek galeri baru
      tags:
      - gallery
  /api/v1/gallery/{id}:
    delete:
      description: Menghapus satu proyek berdasarkan ID UUID.
      parameters:
      - description: ID Proyek (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
